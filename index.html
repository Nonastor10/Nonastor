<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nona Store | اكسسوارات نسائية أنيقة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="lm-header">
    <div class="lm-brand">Nona <span>Store</span></div>
    <button class="lm-cart-btn" id="cartBtn" aria-label="السلة">
      🛍
      <span class="lm-cart-badge" id="cartBadge" style="display:none;">0</span>
    </button>
  </header>

  <section class="lm-hero">
    <div class="lm-hero-text">
      <h1 class="lm-display">التفاصيل الصغيرة اللي بتفرق</h1>
      <p>تشكيلة مختارة من الخواتم والأساور والعقود والأقراط، بلمسة ذهبية هادية تناسب كل يوم.</p>
      <button class="lm-cta" id="browseBtn">تصفّحي التشكيلة</button>
    </div>
    <div class="lm-hero-motif">
      <div class="lm-ring r1"></div>
      <div class="lm-ring r2"></div>
      <div class="lm-ring r3"></div>
    </div>
  </section>

  <section class="lm-section" id="catalog">
    <div class="lm-cats" id="catPills"></div>
    <div class="lm-grid" id="productGrid"></div>
  </section>

  <div class="lm-overlay" id="overlay"></div>
  <div class="lm-drawer" id="drawer">
    <div class="lm-drawer-head">
      <h3><span class="lm-bag-dot"></span> سلة المشتريات</h3>
      <button class="lm-icon-btn" id="closeDrawer" aria-label="إغلاق">✕</button>
    </div>
    <div class="lm-drawer-body" id="cartBody"></div>
    <div class="lm-drawer-foot" id="cartFoot" style="display:none;">
      <div class="lm-total-row"><span>الإجمالي</span><span id="cartTotal">0 ج.م</span></div>
      <div class="lm-checkout-fields">
        <input type="text" id="custName" placeholder="اسمك بالكامل" class="lm-checkout-input">
        <input type="tel" id="custPhone" placeholder="رقم موبايلك" class="lm-checkout-input">
        <p class="lm-field-err" id="checkoutErr"></p>
      </div>
      <button class="lm-checkout-btn" id="checkoutBtn">إتمام الطلب</button>
      <p class="lm-note">هذا متجر تجريبي - لا يتم تفعيل دفع حقيقي</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="store.js"></script>
</body>
</html>
